name: Update draw results

on:
  schedule:
    - cron: "30 14 * * *"   # 北京时间 22:30（21:15 开奖后）
    - cron: "40 15 * * *"   # 北京时间 23:40 补抓
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results
        run: python scripts/fetch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ssq.json docs/data/fc3d.json docs/data/ssq.csv docs/data/fc3d.csv
          if git diff --cached --quiet; then echo "no new draw"; exit 0; fi
          git add docs/data/meta.json
          git commit -m "data: $(date -u +%F) draw results"
          git push
